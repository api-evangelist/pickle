name: Pickle
description: 'Pickle is a peer-to-peer fashion rental and resale marketplace that makes
  closets across the United States shareable. Through its iOS app and web storefront,
  shoppers rent, lend, buy, and sell clothing and accessories directly from one another
  at a fraction of retail, with same-day local courier delivery and nationwide two-day
  shipping, while owners earn income on pieces they already own between wears. Founded
  in 2022 and headquartered in New York City, Pickle has raised roughly $20M (including
  a $12M Series A) from investors including Craft Ventures. The company operates a
  consumer marketplace with no publicly documented developer API surface at this time.'
